server {
    # 8080, not 80: this container runs as the unprivileged `nginx` user
    # (see frontend/Dockerfile's `nginx-unprivileged` base image) — the
    # top-level reverse proxy (`nginx/` at the repo root) is what binds
    # 80/443 and forwards here. See docs/deployment-guide.md.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite's build output fingerprints these filenames (content hash in the
    # name), so they're safe to cache aggressively and immutably — a new
    # deploy ships new filenames, never a stale cache-hit of old content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback: let React Router handle client-side routes. Never cache
    # index.html itself — it's what references the current build's
    # fingerprinted asset filenames, so a stale cached copy would point at
    # assets that may no longer exist after the next deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /favicon.svg {
        access_log off;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
