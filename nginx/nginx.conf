# IntelliGrade reverse-proxy — top-level nginx config (Module 08).
#
# This is the ONLY service in docker-compose.prod.yml that publishes a host
# port (80/443) — every other service (postgres, redis, minio, backend,
# worker, and even the frontend's own internal nginx) is reachable only
# from other containers on the Compose network. See docker-compose.prod.yml
# and docs/deployment-guide.md.

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured-ish access log (easy to grep/ingest) — separate from the
    # backend's own JSON request logs (app.middleware.logging_middleware);
    # this one captures what actually reached the edge, including anything
    # the backend never saw (e.g. a request nginx itself rejected).
    log_format proxy_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent",'
        '"request_id":"$request_id"}';
    access_log /var/log/nginx/access.log proxy_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off; # don't advertise the nginx version to clients

    client_max_body_size 60m; # matches UPLOAD_MAX_FILE_SIZE_BYTES's ~50MB + headroom

    # Standard WebSocket-upgrade map (used by conf.d/proxy_params.conf) —
    # `Connection: upgrade` only when the client actually asked to upgrade,
    # `Connection: close` otherwise (a bare "keep-alive" would break
    # non-upgrade keepalive proxying).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    # Proxy-layer rate limiting — a second, independent line of defense in
    # front of the backend's own per-route `@limiter.limit(...)` /
    # SlowAPIMiddleware default (app/middleware/rate_limit.py). Zone sizes
    # are generous (10MB ~ 160k tracked IPs) for a single-node deployment;
    # increase `rate` or add zones per-route if a real traffic profile
    # needs it — see docs/monitoring-guide.md.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
