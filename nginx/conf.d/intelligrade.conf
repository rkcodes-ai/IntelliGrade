# IntelliGrade reverse-proxy server blocks (Module 08).
#
# `/` -> frontend (static SPA build); `/api/`, `/health*`, `/metrics`,
# `/docs`, `/redoc`, `/openapi.json` -> backend. Same-origin from the
# browser's perspective either way, so CORS_ORIGINS only needs your real
# public domain — see .env.production.example.

upstream intelligrade_backend {
    server backend:8000;
    keepalive 32;
}

upstream intelligrade_frontend {
    server frontend:8080;
    keepalive 16;
}

# Plain-HTTP: ACME (Let's Encrypt) challenge + the compose healthcheck stay
# on :80; everything else redirects to HTTPS. See docs/deployment-guide.md
# for the certbot renewal flow this `.well-known` location supports.
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed by default (see nginx/certs/README.md to generate one for
    # local/staging testing) — replace with a real certificate (e.g. via
    # certbot) before handling real user traffic. Never commit real
    # certificate/key files (see .gitignore's `*.pem`/`*.key` rules).
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 60m;

    # --- Backend: API, health probes, OpenAPI docs, Prometheus metrics ---
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://intelligrade_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Tighter limit for auth endpoints specifically, on top of the
    # backend's own `10/minute`(login)/`5/minute`(forgot-password)
    # per-route limits (app/api/v1/endpoints/auth.py) — belt and suspenders
    # against credential-stuffing/brute-force at the edge, before a request
    # even reaches the application.
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://intelligrade_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /health {
        proxy_pass http://intelligrade_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Prometheus scraping only — see docs/monitoring-guide.md for why this
    # is intentionally NOT exposed here in a real deployment (restrict via
    # `allow`/`deny` to your monitoring network, or don't proxy it at all
    # and have Prometheus reach the backend container directly on the
    # `internal` Compose network instead).
    location /metrics {
        deny all;
        return 404;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://intelligrade_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- Frontend: the static SPA build ---
    location / {
        proxy_pass http://intelligrade_frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
