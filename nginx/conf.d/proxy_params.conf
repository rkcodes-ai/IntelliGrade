# Shared proxy headers — included by every `location` block in
# intelligrade.conf that proxies to the backend or frontend upstream.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

# WebSocket upgrade support — no endpoint in this codebase uses WebSockets
# yet, but every proxied location already forwards the upgrade handshake
# headers so a future one (e.g. live evaluation-progress push) works
# without an nginx config change, only an application-side one.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;
