# Prometheus + Grafana overlay (Module 08) — Feature 9 (Observability).
#
# A separate overlay, not merged into docker-compose.prod.yml, so a
# deployment can run the app stack and the monitoring stack independently
# (different host, different lifecycle, or skip monitoring entirely for a
# minimal deployment). Run together with:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml \
#     --env-file .env.production up -d
#
# Prometheus reaches the backend on the `internal` network defined in
# docker-compose.prod.yml (this file's `prometheus` service joins it
# read-only, via `networks.internal.external: true` isn't needed since
# `docker compose -f a -f b` merges both files' `networks:` into one
# project) — Grafana never needs the app network at all, only Prometheus's.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: intelligrade-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - internal
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  grafana:
    image: grafana/grafana:latest
    container_name: intelligrade-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a real Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

networks:
  internal:
    external: false
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
