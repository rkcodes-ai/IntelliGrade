name: Deploy

# Module 08, Feature 6 (CI/CD): the artifact-publishing stage. Builds the
# production targets of the backend/worker/frontend images and pushes them
# to GHCR, tagged by branch/tag/sha per the docker/metadata-action defaults.
#
# This is as far as this workflow goes in this sandbox: an actual rollout
# onto a target environment (staging/production host, k8s cluster, etc.)
# needs environment-specific secrets (SSH keys, kubeconfig, cloud
# credentials...) that don't exist here and shouldn't be invented. Wire a
# real `environment:`-gated deploy job here once a target exists — see
# docs/deployment-guide.md.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: backend/Dockerfile
            target: production
          - service: worker
            context: ./backend
            dockerfile: backend/Dockerfile
            target: worker
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
